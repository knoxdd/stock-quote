<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>指定日收盤價比較表</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d8dee4;
      --accent: #2563eb;
      --hit-bg: #fff1f0;
      --hit-line: #ff9f9a;
      --hit-text: #b42318;
      --soft: #edf2f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      padding: 12px;
    }

    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 9px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    .sub, .status, .note {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 170px minmax(240px, 1fr) 120px;
      gap: 8px;
      align-items: end;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    input, button {
      width: 100%;
      min-height: 36px;
      border-radius: 8px;
      font: inherit;
    }

    input {
      border: 1px solid var(--line);
      padding: 0 10px;
      background: white;
      color: var(--text);
    }

    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .summary-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
      display: grid;
      gap: 4px;
    }

    .symbol {
      font-weight: 800;
      font-size: 24px;
      line-height: 1;
    }

    .baseline {
      font-size: 16px;
      font-weight: 800;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      max-height: 72vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
      font-size: 16px;
      table-layout: fixed;
    }

    th, td {
      padding: 8px 7px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      z-index: 2;
      background: inherit;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--soft);
      color: var(--text);
    }

    th:first-child {
      z-index: 4;
      background: var(--soft);
    }

    tr:nth-child(odd) td {
      background: #fcfcfd;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.hit {
      background: var(--hit-bg) !important;
      color: var(--hit-text);
      font-weight: 900;
      box-shadow: inset 0 0 0 1px var(--hit-line);
    }

    .diff {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: inherit;
      opacity: 0.82;
      margin-top: 1px;
    }

    @media (max-width: 780px) {
      .controls { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .summary-grid { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>指定日收盤價比較表</h1>
        <p class="sub">指定日只取收盤價當基準；表格從下一個交易日列到昨天，達標用紅底粗體標示。</p>
      </div>
      <p class="status" id="updatedAt">讀取資料中</p>
    </header>

    <section class="panel controls">
      <div>
        <label for="startDateInput">指定日期</label>
        <input id="startDateInput" value="1150709" inputmode="numeric" aria-label="指定日期">
      </div>
      <div>
        <label for="symbolsInput">指定股票</label>
        <input id="symbolsInput" value="TSM,NVDA,AMD,AVGO" aria-label="指定股票">
      </div>
      <div>
        <button id="applyBtn" type="button">更新表格</button>
      </div>
    </section>

    <section class="panel">
      <div class="status" id="status">讀取資料中</div>
      <p class="note">日期可輸入民國年月日，例如 1150709；也可輸入西元 2026-07-09。資料來源沿用 GitHub Actions 產生的 <code>data/prices.json</code>。</p>
    </section>

    <section class="summary-grid" id="summaryCards"></section>

    <section class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <script>
    const startDateInput = document.querySelector("#startDateInput");
    const symbolsInput = document.querySelector("#symbolsInput");
    const applyBtn = document.querySelector("#applyBtn");
    const statusEl = document.querySelector("#status");
    const updatedAtEl = document.querySelector("#updatedAt");
    const summaryCards = document.querySelector("#summaryCards");
    const thead = document.querySelector("#thead");
    const tbody = document.querySelector("#tbody");
    let priceData = null;

    function money(value) {
      if (!Number.isFinite(value)) return "--";
      return value.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }

    function pct(value) {
      if (!Number.isFinite(value)) return "--";
      return `${value >= 0 ? "+" : ""}${value.toFixed(2)}%`;
    }

    function localDateValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function yesterdayDate() {
      const date = new Date();
      date.setDate(date.getDate() - 1);
      return localDateValue(date);
    }

    function parseDateInput(value) {
      const raw = String(value || "").trim();
      if (/^\d{7}$/.test(raw)) {
        const year = Number(raw.slice(0, 3)) + 1911;
        return `${year}-${raw.slice(3, 5)}-${raw.slice(5, 7)}`;
      }
      if (/^\d{8}$/.test(raw)) {
        return `${raw.slice(0, 4)}-${raw.slice(4, 6)}-${raw.slice(6, 8)}`;
      }
      if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
      throw new Error("日期格式不正確，請輸入 1150709 或 2026-07-09");
    }

    function parseSymbols(value) {
      const symbols = String(value || "")
        .split(/[,\s，、]+/)
        .map((symbol) => symbol.trim().toUpperCase())
        .filter(Boolean);
      return [...new Set(symbols)];
    }

    async function loadData() {
      const response = await fetch(`data/prices.json?ts=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`無法讀取 data/prices.json (${response.status})`);
      priceData = await response.json();
      updatedAtEl.textContent = `資料更新：${priceData.updatedAt ? new Date(priceData.updatedAt).toLocaleString("zh-TW", { hour12: false }) : "尚未更新"}`;
      render();
    }

    function rowsFor(symbol) {
      return priceData?.symbols?.[symbol]?.rows || [];
    }

    function rowsInRange(symbol, startDate, endDate) {
      return rowsFor(symbol).filter((row) => row.date >= startDate && row.date <= endDate);
    }

    function baselineFor(symbol, startDate) {
      const rows = rowsFor(symbol);
      return rows.find((row) => row.date >= startDate) || null;
    }

    function latestAvailableEnd(symbols, yesterday) {
      const latestDates = symbols.map((symbol) => {
        const rows = rowsFor(symbol).filter((row) => row.date <= yesterday);
        return rows.at(-1)?.date || "";
      }).filter(Boolean);
      if (!latestDates.length) return yesterday;
      return latestDates.sort()[0];
    }

    function collectDates(symbols, startDate, endDate) {
      const set = new Set();
      symbols.forEach((symbol) => {
        rowsInRange(symbol, startDate, endDate).forEach((row) => set.add(row.date));
      });
      return [...set].sort();
    }

    function rowByDate(symbol) {
      const map = new Map();
      rowsFor(symbol).forEach((row) => map.set(row.date, row));
      return map;
    }

    function render() {
      try {
        const requestedStart = parseDateInput(startDateInput.value);
        const symbols = parseSymbols(symbolsInput.value);
        if (!symbols.length) throw new Error("請至少輸入一支股票");
        const missing = symbols.filter((symbol) => !priceData?.symbols?.[symbol]?.rows?.length);
        if (missing.length) throw new Error(`data/prices.json 沒有資料：${missing.join(", ")}`);

        const baselines = Object.fromEntries(symbols.map((symbol) => [symbol, baselineFor(symbol, requestedStart)]));
        const baselineMissing = symbols.filter((symbol) => !baselines[symbol]);
        if (baselineMissing.length) throw new Error(`找不到指定日之後的基準收盤價：${baselineMissing.join(", ")}`);

        const baselineDates = Object.values(baselines).map((row) => row.date).sort();
        const firstBaselineDate = baselineDates[0];
        const tableStartDate = baselineDates[baselineDates.length - 1];
        const endDate = latestAvailableEnd(symbols, yesterdayDate());
        const dates = collectDates(symbols, tableStartDate, endDate).filter((date) => date > tableStartDate);
        const maps = Object.fromEntries(symbols.map((symbol) => [symbol, rowByDate(symbol)]));

        renderSummary(symbols, baselines, requestedStart, firstBaselineDate, endDate, dates);
        renderTable(symbols, baselines, maps, dates);
        statusEl.textContent = `指定日期 ${startDateInput.value} 對應西元 ${requestedStart}；基準日不列入表格，表格顯示 ${dates[0] || "--"} 到 ${endDate}，共 ${dates.length} 個交易日。`;
      } catch (error) {
        statusEl.textContent = error.message;
        summaryCards.innerHTML = "";
        thead.innerHTML = "";
        tbody.innerHTML = "";
      }
    }

    function renderSummary(symbols, baselines, requestedStart, startDate, endDate, dates) {
      summaryCards.innerHTML = symbols.map((symbol) => {
        const base = baselines[symbol];
        const rows = rowsInRange(symbol, startDate, endDate);
        const comparableRows = rows.filter((row) => row.date > base.date);
        const hits = comparableRows.filter((row) => row.close >= base.close).length;
        const last = rows.at(-1);
        const diff = last ? last.close - base.close : NaN;
        const diffPct = last ? diff / base.close * 100 : NaN;
        return `
          <article class="summary-card">
            <div class="symbol">${symbol}</div>
            <div class="baseline">基準 ${base.date}: ${money(base.close)}</div>
            <div class="small">最新 ${last?.date || "--"}: ${last ? money(last.close) : "--"} / ${pct(diffPct)}</div>
            <div class="small">達標天數：${hits} / ${comparableRows.length}</div>
          </article>
        `;
      }).join("");
    }

    function renderTable(symbols, baselines, maps, dates) {
      thead.innerHTML = `
        <tr>
          <th>日期</th>
          ${symbols.map((symbol) => `<th>${symbol}<br><span class="small">基準 ${money(baselines[symbol].close)}</span></th>`).join("")}
        </tr>
      `;
      tbody.innerHTML = dates.map((date) => `
        <tr>
          <td>${date}</td>
          ${symbols.map((symbol) => renderCell(maps[symbol].get(date), baselines[symbol].close)).join("")}
        </tr>
      `).join("");
    }

    function renderCell(row, baseline) {
      if (!row) return "<td>--</td>";
      const diff = row.close - baseline;
      const diffPct = diff / baseline * 100;
      const isHit = row.close >= baseline;
      return `
        <td class="${isHit ? "hit" : ""}">
          ${money(row.close)}
          <span class="diff">${diff >= 0 ? "+" : "-"}${money(Math.abs(diff))} / ${pct(diffPct)}</span>
        </td>
      `;
    }

    applyBtn.addEventListener("click", render);
    startDateInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") render();
    });
    symbolsInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") render();
    });

    loadData().catch((error) => {
      statusEl.textContent = error.message;
    });
  </script>
</body>
</html>
